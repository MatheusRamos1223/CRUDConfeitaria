<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos — Confeitaria</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <!-- Tela T1 de docs/fases-2-4.md. Layout: filtro → lista → formulário (padrão de tela, seção 1.1). -->
    <main class="pagina">
        <div class="titulo-pagina">
            <h1>Produtos</h1>
            <span class="subtitulo">Cardápio da confeitaria</span>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <!-- 1. Barra de filtro → GET /produtos?nome=&categoriaId=&situacao=&pagina=&tamanho= -->
        <form id="filtro" class="barra-filtro cartao" role="search">
            <div class="campo campo-busca">
                <label for="filtro-nome">Nome</label>
                <input id="filtro-nome" name="nome" maxlength="120" placeholder="Buscar por nome">
            </div>
            <div class="campo">
                <label for="filtro-categoria">Categoria</label>
                <select id="filtro-categoria" name="categoriaId">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtro-situacao">Situação</label>
                <select id="filtro-situacao" name="situacao">
                    <option value="Ativos" selected>Ativos</option>
                    <option value="Inativos">Inativos</option>
                    <option value="Todos">Todos</option>
                </select>
            </div>
            <div class="botoes">
                <button class="botao botao-primario" type="submit">Filtrar</button>
                <button class="botao" type="reset">Limpar</button>
            </div>
        </form>

        <!-- 2. Lista + paginador -->
        <section class="lista cartao" aria-labelledby="titulo-lista">
            <div class="lista-cabecalho">
                <h2 id="titulo-lista">Produtos cadastrados</h2>
                <span class="contagem" id="contagem"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Categoria</th>
                        <th scope="col" class="num">Preço</th>
                        <th scope="col">Situação</th>
                        <th scope="col"><span class="sr-only">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
            <div class="paginador" id="paginador"></div>
        </section>

        <!-- 3. Formulário + 4. ações → POST /produtos | PUT /produtos/{id} -->
        <form id="formulario" class="formulario cartao">
            <h2 id="titulo-formulario">Cadastrar produto</h2>
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" maxlength="120" required>
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>
                </div>
                <div class="campo">
                    <label for="categoriaId">Categoria</label>
                    <select id="categoriaId" name="categoriaId" required>
                        <option value="">Selecione</option>
                    </select>
                </div>
            </div>
            <p class="ajuda">Desativar e reativar ficam na lista (apenas Admin).</p>
            <div class="acoes-formulario">
                <button id="salvar" class="botao botao-primario" type="submit">Cadastrar</button>
                <button id="cancelar" class="botao" type="button" hidden>Cancelar</button>
            </div>
        </form>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/paginas/produtos.js"></script>
</body>
</html>
