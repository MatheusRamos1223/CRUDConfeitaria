<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso — Confeitaria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5ef;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: min(320px, 80vw);
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }

        button {
            background: #793e29;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Acesso à confeitaria</h1>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input id="email"
                   name="email"
                   type="email"
                   autocomplete="username"
                   required>

            <label for="senha">Senha</label>
            <input id="senha"
                   name="senha"
                   type="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem" role="status"></p>
        <p><a href="/cadastro.html">Criar usuário</a></p>
    </main>

    <script>const formulario = document.querySelector("#form-login");
        const mensagem = document.querySelector("#mensagem");

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const botao = formulario.querySelector("button");
            botao.disabled = true;
            mensagem.textContent = "Verificando acesso...";

            try {
                const resposta = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: formulario.elements.email.value,
                        senha: formulario.elements.senha.value
                    })
                });

                if (resposta.ok) {
                    window.location.href = "/produtos.html";
                    mensagem.textContent = "Login realizado!";
                    formulario.elements.senha.value = "";
                } else if (resposta.status === 401) {
                    mensagem.textContent = "E-mail ou senha inválidos."; // 



                } else {
                    mensagem.textContent = "Não foi possível entrar.";
                }
            } catch {
                mensagem.textContent = "Não foi possível conectar ao servidor.";
            } finally {
                botao.disabled = false;
            }
        });</script>
</body>
</html>
