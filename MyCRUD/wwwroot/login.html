<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso — Confeitaria</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="pagina-acesso">
    <main>
        <h1>Acesso à confeitaria</h1>

        <form id="form-login">
            <label for="email">E-mail</label>
            <input id="email"
                   name="email"
                   type="email"
                   autocomplete="username"
                   required>

            <label for="senha">Senha</label>
            <input id="senha"
                   name="senha"
                   type="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem" role="status"></p>
        <p><a href="/cadastro.html">Criar usuário</a></p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/paginas/login.js"></script>
</body>
</html>
