<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar usuário</title>
</head>
<body>
    <h1>Cadastrar usuário</h1>

    <form id="form-cadastro">
        <p>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" autocomplete="name" required>
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input id="email" name="email" type="email"
                   autocomplete="username" required>
        </p>

        <p>
            <label for="senha">Senha:</label>
            <input id="senha" name="senha" type="password"
                   autocomplete="new-password" minlength="8" required>
        </p>

        <button type="submit">Criar usuário</button>
    </form>

    <p id="mensagem" role="status"></p>
    <a href="/login.html">Voltar ao login</a>

    <script>const formulario = document.querySelector("#form-cadastro");
        const mensagem = document.querySelector("#mensagem");

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const botao = formulario.querySelector("button");
            botao.disabled = true;
            mensagem.textContent = "Cadastrando...";

            try {
                const resposta = await fetch("/login/cadastro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: formulario.elements.nome.value,
                        email: formulario.elements.email.value,
                        senha: formulario.elements.senha.value
                    })
                });

                if (resposta.ok) {
                    formulario.reset();
                    mensagem.textContent =
                        "Usuário criado! Agora você pode fazer login.";
                } else if (resposta.status === 409) {
                    mensagem.textContent = "E-mail já cadastrado.";
                } else if (resposta.status === 400) {
                    mensagem.textContent =
                        "Confira os dados. A senha precisa ter pelo menos 8 caracteres.";
                } else {
                    mensagem.textContent = "Não foi possível cadastrar.";
                }
            } catch {
                mensagem.textContent = "Não foi possível conectar ao servidor.";
            } finally {
                botao.disabled = false;
            }
        });</script>
</body>
</html>
