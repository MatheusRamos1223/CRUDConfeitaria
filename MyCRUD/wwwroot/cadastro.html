<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar usuário — Confeitaria</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="pagina-acesso">
    <main>
        <h1>Cadastrar usuário</h1>

        <!-- Disponível só com a API em Development. Não há campo de papel: o cadastro
             sempre cria Operador. Admin é quem entra com o e-mail de Admin:Email. -->
        <p class="ajuda">Toda conta nova entra como <strong>Operador</strong>.</p>

        <form id="form-cadastro">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="name" maxlength="120" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email"
                   autocomplete="username" maxlength="254" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password"
                   autocomplete="new-password" minlength="8" maxlength="128" required>

            <button type="submit">Criar usuário</button>
        </form>

        <p id="mensagem" role="status"></p>
        <p><a href="/login.html">Voltar ao login</a></p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/paginas/cadastro.js"></script>
</body>
</html>
