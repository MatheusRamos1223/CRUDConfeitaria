<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Protótipo] Pedido #1042 — Confeitaria</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <!-- PROTÓTIPO: dados fictícios, sem chamada à API. Contrato em docs/fases-2-4.md (tela T5).
         Mesmo esqueleto das outras telas: o lugar da barra de filtro mostra o resumo,
         a lista mostra os itens, e as ações são as transições de status permitidas. -->
    <main class="pagina pagina-larga">
        <div class="titulo-pagina">
            <h1 id="titulo">Pedido</h1>
            <span id="selo-status"></span>
            <a class="botao botao-pequeno" href="pedidos.html">← Voltar aos pedidos</a>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <!-- 1. Resumo (posição da barra de filtro) → GET /pedidos/{id} -->
        <section class="cartao" style="grid-area: filtro" aria-label="Resumo do pedido">
            <dl class="resumo" id="resumo"></dl>
            <div class="linha-do-tempo" id="linha-do-tempo"></div>
        </section>

        <!-- 2. Lista de itens (somente leitura: preço congelado na criação) -->
        <section class="lista cartao" aria-labelledby="titulo-itens">
            <div class="lista-cabecalho">
                <h2 id="titulo-itens">Itens</h2>
                <span class="contagem">Preços fixados em <span id="criado-em"></span></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Produto</th>
                        <th scope="col" class="num">Qtd.</th>
                        <th scope="col" class="num">Preço unit.</th>
                        <th scope="col" class="num">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="num">Total</td>
                        <td class="num" id="total"></td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <!-- 4. Ações → POST /pedidos/{id}/confirmar | /entregar | /cancelar (Admin) -->
        <div class="acoes-pagina cartao" id="acoes">
            <span class="ajuda espaco" id="ajuda-acoes"></span>
        </div>
    </main>

    <script src="../js/layout.js"></script>
    <script>
        // PedidoDetalheDto fictício
        const pedido = {
            id: 1042,
            clienteId: 1,
            clienteNome: "Maria Aparecida Santos",
            clienteTelefone: "19996543210",
            dataEntrega: "2026-11-18",
            status: "Confirmado",
            criadoEm: "2026-11-12T17:42:00Z",
            itens: [
                { produtoId: 7, produtoNome: "Bolo red velvet", quantidade: 1, precoUnitario: 89.9, subtotal: 89.9 },
                { produtoId: 8, produtoNome: "Bolo de pote — ninho com morango", quantidade: 6, precoUnitario: 14.5, subtotal: 87 },
                { produtoId: 19, produtoNome: "Minibolo de limão", quantidade: 4, precoUnitario: 9.5, subtotal: 38 }
            ],
            total: 214.9
        };

        document.querySelector("#titulo").textContent = `Pedido #${pedido.id}`;
        document.querySelector("#selo-status").appendChild(criarSelo(pedido.status));
        document.querySelector("#criado-em").textContent = formatarDataHora(pedido.criadoEm);

        // Resumo
        const resumo = document.querySelector("#resumo");
        const campos = [
            ["Cliente", pedido.clienteNome],
            ["Telefone", formatarTelefone(pedido.clienteTelefone)],
            ["Entrega", formatarData(pedido.dataEntrega)],
            ["Itens", String(pedido.itens.reduce((s, i) => s + i.quantidade, 0))],
            ["Total", formatarMoeda(pedido.total)]
        ];
        for (const [rotulo, valor] of campos) {
            const bloco = document.createElement("div");
            const dt = document.createElement("dt");
            dt.textContent = rotulo;
            const dd = document.createElement("dd");
            dd.textContent = valor;
            bloco.append(dt, dd);
            resumo.appendChild(bloco);
        }

        // Linha do tempo: Aberto → Confirmado → Entregue (Cancelado encerra o fluxo)
        const etapas = ["Aberto", "Confirmado", "Entregue"];
        const indiceAtual = etapas.indexOf(pedido.status);
        const linhaDoTempo = document.querySelector("#linha-do-tempo");
        etapas.forEach((etapa, i) => {
            const div = document.createElement("div");
            div.className = i < indiceAtual ? "etapa feita" : i === indiceAtual ? "etapa atual" : "etapa";
            div.textContent = etapa;
            linhaDoTempo.appendChild(div);
        });

        // Itens
        const linhas = document.querySelector("#linhas");
        for (const item of pedido.itens) {
            const tr = document.createElement("tr");
            tr.append(criarCelula(item.produtoNome), criarCelula(item.quantidade, "num"),
                criarCelula(formatarMoeda(item.precoUnitario), "num"),
                criarCelula(formatarMoeda(item.subtotal), "num"));
            linhas.appendChild(tr);
        }
        document.querySelector("#total").textContent = formatarMoeda(pedido.total);

        // Ações: só as transições válidas para o status atual (R28, R30).
        const transicoes = {
            Aberto: [["Confirmar pedido", "botao-primario"], ["Cancelar pedido", "botao-perigo so-admin"]],
            Confirmado: [["Marcar como entregue", "botao-primario"], ["Cancelar pedido", "botao-perigo so-admin"]],
            Entregue: [],
            Cancelado: []
        };
        const acoes = document.querySelector("#acoes");
        for (const [texto, classe] of transicoes[pedido.status]) {
            const botao = criarBotao(texto, classe);
            botao.classList.remove("botao-pequeno");
            acoes.appendChild(botao);
        }
        document.querySelector("#ajuda-acoes").textContent = transicoes[pedido.status].length
            ? "Entregue e Cancelado são finais. Cancelar exige Admin."
            : "Pedido finalizado: nenhuma ação disponível.";

        iniciarLayout({
            ativo: "pedidos",
            prototipo: true,
            usuario: { id: 1, nome: "Ana Souza", email: "ana@confeitaria.dev", papel: "Admin" }
        });
    </script>
</body>
</html>
