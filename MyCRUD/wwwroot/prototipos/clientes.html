<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Protótipo] Clientes — Confeitaria</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <!-- PROTÓTIPO: dados fictícios, sem chamada à API. Contrato em docs/fases-2-4.md (tela T3). -->
    <main class="pagina">
        <div class="titulo-pagina">
            <h1>Clientes</h1>
            <span class="subtitulo">Quem encomenda com a confeitaria</span>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <!-- 1. Barra de filtro → GET /clientes?busca=&pagina= -->
        <form class="barra-filtro cartao" role="search">
            <div class="campo campo-busca">
                <label for="filtro-busca">Nome ou telefone</label>
                <input id="filtro-busca" name="busca" placeholder="Ex.: Maria ou 19 9">
            </div>
            <div class="botoes">
                <button class="botao botao-primario" type="submit">Filtrar</button>
                <button class="botao" type="reset">Limpar</button>
            </div>
        </form>

        <!-- 2. Lista + paginador -->
        <section class="lista cartao" aria-labelledby="titulo-lista">
            <div class="lista-cabecalho">
                <h2 id="titulo-lista">Clientes cadastrados</h2>
                <span class="contagem" id="contagem"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Telefone</th>
                        <th scope="col">E-mail</th>
                        <th scope="col"><span class="sr-only">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
            <div class="paginador" id="paginador"></div>
        </section>

        <!-- 3. Formulário + 4. ações → POST /clientes | PUT /clientes/{id} -->
        <form class="formulario cartao">
            <h2>Novo cliente</h2>
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" maxlength="120" required autocomplete="off">
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" required placeholder="(19) 99999-0000">
                <span class="ajuda">Com DDD. Salvo só com números (10 ou 11 dígitos).</span>
            </div>
            <div class="campo">
                <label for="email">E-mail <span class="opcional">(opcional)</span></label>
                <input id="email" name="email" type="email" maxlength="254">
            </div>
            <div class="acoes-formulario">
                <button class="botao botao-primario" type="submit">Cadastrar</button>
                <button class="botao" type="button" hidden>Cancelar</button>
            </div>
        </form>
    </main>

    <script src="../js/layout.js"></script>
    <script>
        const pagina = {
            itens: [
                { id: 4, nome: "Beatriz Lima", telefone: "19998761234", email: "bia.lima@exemplo.com" },
                { id: 12, nome: "Carlos Menezes", telefone: "1934567890", email: null },
                { id: 2, nome: "Fernanda Rocha", telefone: "19991112233", email: "fe.rocha@exemplo.com" },
                { id: 9, nome: "João Pedro Alves", telefone: "11987654321", email: null },
                { id: 1, nome: "Maria Aparecida Santos", telefone: "19996543210", email: "maria.santos@exemplo.com" },
                { id: 15, nome: "Padaria Pão Quente (revenda)", telefone: "1934061122", email: "compras@exemplo.com" },
                { id: 7, nome: "Rafael Tavares", telefone: "19992223344", email: null },
                { id: 3, nome: "Sofia Martins", telefone: "19995556677", email: "sofia.m@exemplo.com" }
            ],
            pagina: 1, tamanhoPagina: 8, total: 23, totalPaginas: 3
        };

        const linhas = document.querySelector("#linhas");
        for (const c of pagina.itens) {
            const tr = document.createElement("tr");
            const acoes = document.createElement("td");
            acoes.className = "acoes";
            acoes.append(criarBotao("Editar"), criarBotao("Excluir", "botao-perigo so-admin"));

            tr.append(criarCelula(c.id, "id"), criarCelula(c.nome),
                criarCelula(formatarTelefone(c.telefone)), criarCelula(c.email ?? "—"), acoes);
            linhas.appendChild(tr);
        }

        document.querySelector("#contagem").textContent = `${pagina.total} encontrados`;
        montarPaginador(document.querySelector("#paginador"), pagina, () => {});

        mostrarMensagem(document.querySelector("#mensagem"), "Cliente cadastrado.", "sucesso");

        iniciarLayout({
            ativo: "clientes",
            prototipo: true,
            usuario: { id: 2, nome: "Bruno Costa", email: "bruno@confeitaria.dev", papel: "Operador" }
        });
    </script>
</body>
</html>
