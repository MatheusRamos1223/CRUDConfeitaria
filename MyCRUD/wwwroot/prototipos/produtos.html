<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Protótipo] Produtos — Confeitaria</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <!-- PROTÓTIPO: dados fictícios, sem chamada à API. Contrato em docs/fases-2-4.md (tela T1). -->
    <main class="pagina">
        <div class="titulo-pagina">
            <h1>Produtos</h1>
            <span class="subtitulo">Cardápio da confeitaria</span>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <!-- 1. Barra de filtro → GET /produtos?nome=&categoriaId=&situacao=&pagina= -->
        <form id="filtro" class="barra-filtro cartao" role="search">
            <div class="campo campo-busca">
                <label for="filtro-nome">Nome</label>
                <input id="filtro-nome" name="nome" placeholder="Buscar por nome" value="bolo">
            </div>
            <div class="campo">
                <label for="filtro-categoria">Categoria</label>
                <select id="filtro-categoria" name="categoriaId"></select>
            </div>
            <div class="campo">
                <label for="filtro-situacao">Situação</label>
                <select id="filtro-situacao" name="situacao">
                    <option value="Ativos">Ativos</option>
                    <option value="Inativos">Inativos</option>
                    <option value="Todos" selected>Todos</option>
                </select>
            </div>
            <div class="botoes">
                <button class="botao botao-primario" type="submit">Filtrar</button>
                <button class="botao" type="reset">Limpar</button>
            </div>
        </form>

        <!-- 2. Lista + paginador -->
        <section class="lista cartao" aria-labelledby="titulo-lista">
            <div class="lista-cabecalho">
                <h2 id="titulo-lista">Produtos cadastrados</h2>
                <span class="contagem" id="contagem"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Categoria</th>
                        <th scope="col" class="num">Preço</th>
                        <th scope="col">Situação</th>
                        <th scope="col"><span class="sr-only">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
            <div class="paginador" id="paginador"></div>
        </section>

        <!-- 3. Formulário + 4. ações → POST /produtos | PUT /produtos/{id} -->
        <form id="formulario" class="formulario cartao editando">
            <h2 id="titulo-formulario">Editar produto 3</h2>
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" maxlength="120" required value="Bolo de cenoura com chocolate">
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input id="preco" name="preco" type="number" min="0.01" step="0.01" required value="58.00">
                </div>
                <div class="campo">
                    <label for="categoriaId">Categoria</label>
                    <select id="categoriaId" name="categoriaId" required></select>
                </div>
            </div>
            <p class="ajuda">Ativar e desativar ficam na lista (apenas Admin).</p>
            <div class="acoes-formulario">
                <button class="botao botao-primario" type="submit">Salvar alterações</button>
                <button class="botao" type="button">Cancelar</button>
            </div>
        </form>
    </main>

    <script src="../js/layout.js"></script>
    <script>
        // Dados fictícios no formato do contrato (ProdutoRespostaDto dentro de Pagina<T>).
        const categorias = [
            { id: 1, nome: "Bolos" }, { id: 2, nome: "Doces finos" },
            { id: 3, nome: "Tortas" }, { id: 4, nome: "Salgados" }
        ];

        const pagina = {
            itens: [
                { id: 1, nome: "Bolo de chocolate", preco: 45.9, categoriaId: 1, categoriaNome: "Bolos", ativo: true },
                { id: 3, nome: "Bolo de cenoura com chocolate", preco: 58, categoriaId: 1, categoriaNome: "Bolos", ativo: true },
                { id: 7, nome: "Bolo red velvet", preco: 89.9, categoriaId: 1, categoriaNome: "Bolos", ativo: true },
                { id: 8, nome: "Bolo de pote — ninho com morango", preco: 14.5, categoriaId: 2, categoriaNome: "Doces finos", ativo: true },
                { id: 11, nome: "Bolo de fubá cremoso", preco: 32, categoriaId: 1, categoriaNome: "Bolos", ativo: false },
                { id: 14, nome: "Bolo gelado de coco", preco: 39.9, categoriaId: 1, categoriaNome: "Bolos", ativo: true },
                { id: 19, nome: "Minibolo de limão", preco: 9.5, categoriaId: 2, categoriaNome: "Doces finos", ativo: true },
                { id: 22, nome: "Bolo de nozes (sazonal)", preco: 96, categoriaId: 1, categoriaNome: "Bolos", ativo: false }
            ],
            pagina: 1, tamanhoPagina: 8, total: 12, totalPaginas: 2
        };

        function preencherSelect(select, opcoes, primeira) {
            if (primeira) select.appendChild(new Option(primeira, ""));
            for (const c of opcoes) select.appendChild(new Option(c.nome, c.id));
        }

        preencherSelect(document.querySelector("#filtro-categoria"), categorias, "Todas");
        preencherSelect(document.querySelector("#categoriaId"), categorias);
        document.querySelector("#categoriaId").value = "1";

        const linhas = document.querySelector("#linhas");
        for (const p of pagina.itens) {
            const tr = document.createElement("tr");
            if (!p.ativo) tr.classList.add("inativo");
            if (p.id === 3) tr.classList.add("em-edicao");

            const situacao = document.createElement("td");
            situacao.appendChild(p.ativo ? criarSelo("Ativo", "ativo") : criarSelo("Inativo", "inativo"));

            const acoes = document.createElement("td");
            acoes.className = "acoes";
            acoes.appendChild(criarBotao("Editar"));
            acoes.appendChild(p.ativo
                ? criarBotao("Desativar", "botao-perigo so-admin")
                : criarBotao("Reativar", "so-admin"));

            tr.append(
                criarCelula(p.id, "id"), criarCelula(p.nome), criarCelula(p.categoriaNome),
                criarCelula(formatarMoeda(p.preco), "num"), situacao, acoes);
            linhas.appendChild(tr);
        }

        document.querySelector("#contagem").textContent = `${pagina.total} encontrados`;
        montarPaginador(document.querySelector("#paginador"), pagina, () => {});

        iniciarLayout({
            ativo: "produtos",
            prototipo: true,
            usuario: { id: 1, nome: "Ana Souza", email: "ana@confeitaria.dev", papel: "Admin" }
        });
    </script>
</body>
</html>
