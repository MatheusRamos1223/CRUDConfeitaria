<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Protótipo] Categorias — Confeitaria</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
    <!-- PROTÓTIPO: dados fictícios, sem chamada à API. Contrato em docs/fases-2-4.md (tela T2). -->
    <main class="pagina">
        <div class="titulo-pagina">
            <h1>Categorias</h1>
            <span class="subtitulo">Agrupam os produtos do cardápio</span>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

        <!-- 1. Barra de filtro → GET /categorias?nome=&pagina= -->
        <form class="barra-filtro cartao" role="search">
            <div class="campo campo-busca">
                <label for="filtro-nome">Nome</label>
                <input id="filtro-nome" name="nome" placeholder="Buscar por nome">
            </div>
            <div class="botoes">
                <button class="botao botao-primario" type="submit">Filtrar</button>
                <button class="botao" type="reset">Limpar</button>
            </div>
        </form>

        <!-- 2. Lista + paginador -->
        <section class="lista cartao" aria-labelledby="titulo-lista">
            <div class="lista-cabecalho">
                <h2 id="titulo-lista">Categorias cadastradas</h2>
                <span class="contagem" id="contagem"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col" class="num">Produtos</th>
                        <th scope="col"><span class="sr-only">Ações</span></th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
            <div class="paginador" id="paginador"></div>
        </section>

        <!-- 3. Formulário + 4. ações → POST /categorias | PUT /categorias/{id} (somente Admin) -->
        <form class="formulario cartao">
            <h2>Nova categoria</h2>
            <div class="so-admin">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" maxlength="60" required placeholder="Ex.: Bolos de pote">
                    <span class="ajuda">Único, sem diferenciar maiúsculas (Bolos = bolos).</span>
                </div>
                <div class="acoes-formulario">
                    <button class="botao botao-primario" type="submit">Cadastrar</button>
                    <button class="botao" type="button" hidden>Cancelar</button>
                </div>
            </div>
            <p class="aviso-permissao" data-somente-operador>Apenas Admin cadastra, edita ou exclui categorias.</p>
        </form>
    </main>

    <script src="../js/layout.js"></script>
    <script>
        const pagina = {
            itens: [
                { id: 5, nome: "Bebidas", quantidadeProdutos: 0 },
                { id: 1, nome: "Bolos", quantidadeProdutos: 9 },
                { id: 7, nome: "Categoria 7", quantidadeProdutos: 2 },
                { id: 2, nome: "Doces finos", quantidadeProdutos: 14 },
                { id: 4, nome: "Salgados", quantidadeProdutos: 7 },
                { id: 3, nome: "Tortas", quantidadeProdutos: 5 }
            ],
            pagina: 1, tamanhoPagina: 20, total: 6, totalPaginas: 1
        };

        const linhas = document.querySelector("#linhas");
        for (const c of pagina.itens) {
            const tr = document.createElement("tr");
            const acoes = document.createElement("td");
            acoes.className = "acoes";
            acoes.appendChild(criarBotao("Editar", "so-admin"));

            // Excluir só faz sentido sem produtos; a API devolve 409 se houver (R9).
            const excluir = criarBotao("Excluir", "botao-perigo so-admin");
            if (c.quantidadeProdutos > 0) {
                excluir.disabled = true;
                excluir.title = "Possui produtos — mova-os antes de excluir";
            }
            acoes.appendChild(excluir);

            tr.append(criarCelula(c.id, "id"), criarCelula(c.nome),
                criarCelula(c.quantidadeProdutos, "num"), acoes);
            linhas.appendChild(tr);
        }

        document.querySelector("#contagem").textContent = `${pagina.total} encontradas`;
        montarPaginador(document.querySelector("#paginador"), pagina, () => {});

        mostrarMensagem(document.querySelector("#mensagem"),
            "Categoria 7 foi criada automaticamente pela migração para produtos antigos — renomeie-a.", "info");

        iniciarLayout({
            ativo: "categorias",
            prototipo: true,
            usuario: { id: 1, nome: "Ana Souza", email: "ana@confeitaria.dev", papel: "Admin" }
        }).then((u) => {
            // Aviso de permissão aparece só para Operador.
            document.querySelector("[data-somente-operador]").hidden = u.papel === "Admin";
        });
    </script>
</body>
</html>
